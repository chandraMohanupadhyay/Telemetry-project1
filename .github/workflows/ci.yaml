
# CI for Product Catalog and Frontend

name: Microservices CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  product-catalog-build:
    name: Go - Product Catalog Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        working-directory: src/product-catalog
        run: |
          go mod download
          go build -o product-catalog-service main.go

      - name: Unit tests
        working-directory: src/product-catalog
        run: go test ./...

  product-catalog-quality:
    name: Go - Product Catalog Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.5.0
          working-directory: src/product-catalog

  frontend:
    name: Node.js - Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Test
        working-directory: src/frontend
        run: npm test -- --run

      - name: Build
        working-directory: src/frontend
        run: npm run build

      - name: Code quality
        working-directory: src/frontend
        run: npm run lint
